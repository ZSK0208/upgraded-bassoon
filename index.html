<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>河南财政金融学院 自习室预约</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, sans-serif;
        }
        body {
            min-height: 100vh;
            background-image: url("bg1.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            position: relative;
            color: #fff;
        }
        body::after{
            content: '';
            position: absolute;
            inset: 0;
            background-color: rgba(0,0,0,0.45);
            z-index: 1;
        }
        .container{
            position: relative;
            z-index: 2;
            min-height:100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            animation: fadeIn 1.2s ease-in-out;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .main-title {
            font-size: 42px;
            font-weight: 600;
            text-align: center;
        }
        .en-title {
            font-size: 18px;
            margin-top: 8px;
            text-align: center;
            opacity: 0.9;
        }
        .row-wrap {
            margin-top: 40px;
            display: flex;
            align-items: center;
            gap: 16px;
            justify-content: center;
        }
        .sub-title {
            font-size: 26px;
        }
        .capsule-btn {
            padding: 6px 18px;
            border: 1px solid #ffffff;
            border-radius: 999px;
            color: #ffffff;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.25s ease;
            background: rgba(255,255,255,0.12);
        }
        .capsule-btn:hover {
            background-color: #fff;
            color: #2563eb;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="main-title">河南财政金融学院</div>
        <div class="en-title">Henan Finance University</div>

        <div class="row-wrap">
            <div class="sub-title">自习室预约</div>
            <div class="capsule-btn" onclick="location.href='study-seat.html'">Welcome</div>
        </div>
    </div>
</body>
</html>
